<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رسالة سرية ❤️</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="card">

        <!-- صانع الرسالة -->
        <div id="setup">

            <h1>✨ صانع الرسائل ✨</h1>

            <input
                type="text"
                id="personName"
                placeholder="اسم الشخص">

            <textarea
                id="messageInput"
                placeholder="اكتب رسالتك هنا..."></textarea>

            <button onclick="generateMessage()">
                إنشاء الرابط ❤️
            </button>

        </div>


        <!-- شاشة الرسالة -->
        <div id="messageScreen" class="hidden">

            <h1 id="title"></h1>

            <p id="typing"></p>

            <div class="reply-box">

                <h3>💌 ردّي على الرسالة</h3>

                <textarea
                    id="reply"
                    placeholder="اكتبي ردك هنا..."></textarea>

                <button onclick="sendReply()">
                    إرسال الرد ❤️
                </button>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
